<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联系我们 — Clean Docs</title>
  <link rel="stylesheet" href="/assets/site.css" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="logo" href="/index.html"><span class="logo__mark">C</span>Clean Docs</a>
      <nav class="site-nav" aria-label="主导航">
        <a href="/index.html">首页</a>
        <a href="/guide.html">使用指南</a>
        <a href="/getting-started.html">快速开始</a>
        <a href="/faq.html">常见问题</a>
        <a href="/contact.html" aria-current="page">联系我们</a>
      </nav>
    </div>
  </header>

  <main class="container" id="main">
    <h1 id="hero-banner">联系我们</h1>
    <p class="muted">
      填写下面的表单即可反馈问题。表单在浏览器本地校验，提交后只在页面上给出成功提示，
      <b>不会发起任何网络请求</b>（因此不可能产生 4xx/5xx 错误）。
    </p>

    <div class="grid" style="grid-template-columns: 1fr 300px; align-items: start;">
      <section class="panel">
        <h2>反馈表单</h2>
        <form data-validate novalidate>
          <div class="field">
            <label for="field-name">您的称呼 *</label>
            <input id="field-name" name="name" type="text" autocomplete="name" placeholder="例如：张工" />
            <p class="field__error" id="field-name-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="field-email">邮箱 *</label>
            <input id="field-email" name="email" type="email" autocomplete="email" placeholder="docs@example.com" />
            <p class="field__error" id="field-email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="field-topic">咨询类型 *</label>
            <select id="field-topic" name="topic">
              <option value="">请选择…</option>
              <option value="集成问题">集成问题</option>
              <option value="文档错误">文档错误</option>
              <option value="功能建议">功能建议</option>
              <option value="其他">其他</option>
            </select>
            <p class="field__error" id="field-topic-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="field-message">详细描述 *（至少 10 个字符）</label>
            <textarea id="field-message" name="message" rows="5" placeholder="请描述你遇到的问题、复现步骤与期望结果"></textarea>
            <p class="field__error" id="field-message-error" role="alert"></p>
          </div>

          <div class="toolbar">
            <button class="btn" id="btn-submit-contact" type="submit">提交反馈</button>
            <button class="btn btn--ghost" id="btn-reset-contact" type="reset">清空表单</button>
          </div>

          <p class="form-status" id="form-status" aria-live="polite"></p>
        </form>

        <div id="form-summary" aria-live="polite"></div>
      </section>

      <aside class="panel">
        <h2 style="margin-top:0;">其他联系方式</h2>
        <div class="kv"><span>邮箱</span><a href="mailto:docs@example.com">docs@example.com</a></div>
        <div class="kv"><span>工作时间</span><span class="muted">工作日 09:00–18:00</span></div>
        <div class="kv"><span>响应时长</span><span class="muted">2 个工作日内</span></div>
        <p class="muted">紧急问题请先在<a href="/faq.html">常见问题</a>中检索关键词。</p>
        <div class="toolbar">
          <button class="btn btn--ghost" type="button" data-copy="#support-signature">复制签名</button>
        </div>
        <pre id="support-signature" style="background:#eef2f7;border-radius:8px;padding:12px;overflow:auto;"><code>Clean Docs 支持团队
docs@example.com
工作日 09:00–18:00</code></pre>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>© 2026 Clean Docs（演示用）</span>
      <a href="/index.html">首页</a>
      <a href="/guide.html">使用指南</a>
      <a href="/getting-started.html">快速开始</a>
      <a href="/faq.html">常见问题</a>
    </div>
  </footer>

  <script src="/assets/site.js"></script>
</body>
</html>
